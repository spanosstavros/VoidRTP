# Seconds of countdown (the bar always has 5 segments and scales to this)
countdown-seconds: 5

# What runs when the countdown ends. {player} and {world} are replaced.
# "player" = the player runs it (same as your DeluxeMenus command),
# "console" = the console runs it.
teleport-command: "rtp world {world}"
teleport-as: player

# Cancel conditions
cancel-on-move: true
cancel-on-damage: true

# Where the countdown shows: "actionbar" (above the hearts/hotbar) or "subtitle" (center of screen)
display: actionbar

# Titles. {time} = seconds left, {bar} = the void bar character.
# Colors with & codes.
# The big title is left blank (vanilla titles are huge) - everything is on the smaller subtitle line.
title-tick: " "
subtitle-tick: "&5✦ &d&l{time} &5✦ &r{bar}"
title-go: " "
subtitle-go: "&3✦ &b&lWARP &3✦ &r{bar}"
title-cancel: " "
subtitle-cancel: "&4✦ &c&lCancelled &4✦ &r{bar}"

# A couple of purple specks on the ground at the player's feet while counting down
ground-particles: true
ground-particle-color: "#AA1EFF"

# Fast-travel animation during the last second
warp-animation: true      # particle spiral, bar flicker, teleport burst
warp-effects: true        # short screen wobble + darkness pulse

# Chat messages ("" to disable)
msg-already: "&cYou are already teleporting!"
msg-no-world: "&cUsage: /voidrtp <world>"
msg-player-only: "&cPlayers only."

# Sounds (Bukkit Sound names, "" to disable)
sound-tick: "BLOCK_NOTE_BLOCK_BASS"
sound-warp: "BLOCK_PORTAL_TRAVEL"
sound-go: "ENTITY_ENDERMAN_TELEPORT"
sound-cancel: "BLOCK_ANVIL_LAND"
